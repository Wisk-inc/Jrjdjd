# Scam Radar: scan for live scam sites around the clock and publish what is found every minute.
#
# A run: restore Radar's database from the last run, refresh the blocklists and the list of newly
# registered domains, put new brand look-alikes at the front of the queue, then scan in one-minute
# cycles for 55 minutes. After every cycle a safe snapshot is exported (see
# tools/scam-radar/export.mjs for what is published and why) and force-pushed to the
# scam-radar-data branch, which /scam-radar/ and the map read. So the page gets new numbers about
# once a minute.
#
# At the end the database is saved and the run starts the next one, which picks up from it about
# two minutes later. The status file says "finished" for that hand-over, so the page can say so.
# GitHub's schedule could not keep this going: it starts scheduled workflows when it has room and
# skips many of them (an hourly schedule here started twice in 20 hours).
#
# Only one run goes at a time. A run started while another is going waits for it, and GitHub
# cancels an older waiting run when a newer one queues. A run started by hand scans at once.
#
# What stops the chain: cancelling a run by hand, or a run that fails within ten minutes of starting
# to scan (so a fault cannot start runs in a fast loop). scam-radar-keepalive.yml then starts it
# again, and so does a start by hand from the Actions tab.
#
# Cycles must stay at 60 seconds: Radar gives each cycle a time budget of its length minus four
# seconds, reads certificates only with 20 seconds to spare and starts a visit only with 12.
# Shorter cycles visit nothing. A cycle takes 40 to 55 seconds; exporting and publishing takes
# about eight more, and the loop waits out the rest of the minute when there is any.
name: Scam Radar

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to scan before handing over to a fresh run (5 to 60)
        default: '55'
      chained:
        description: "'yes' when the run before started this one"
        default: 'no'
      rounds:
        description: Not used any more; older runs still send it when they start the next one
        default: ''

permissions:
  contents: write   # publish to the scam-radar-data branch
  actions: write    # start the next run

concurrency:
  group: scam-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RADAR: node tools/scam-radar/scam-finder/cli.js radar
      SCAN_MINUTES: ${{ inputs.minutes || '55' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore the Radar database
        id: db
        uses: actions/cache/restore@v4
        with:
          path: ~/.scam-finder
          key: scam-radar-db-${{ github.run_id }}
          restore-keys: scam-radar-db-

      - name: Build the index (first run, about five minutes)
        if: steps.db.outputs.cache-matched-key == ''
        run: $RADAR ingest all

      - name: Refresh blocklists and newly registered domains
        if: steps.db.outputs.cache-matched-key != ''
        run: |
          $RADAR ingest feeds || echo "::warning::blocklist refresh failed; scanning with the last copy"
          $RADAR ingest nrd || echo "::warning::new-domain refresh failed; scanning with the last copy"

      - name: Scan, publishing after every cycle
        id: scan
        timeout-minutes: 75
        run: |
          echo "SCAN_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          if ! [[ "$SCAN_MINUTES" =~ ^[0-9]+$ ]] || [ "$SCAN_MINUTES" -lt 5 ] || [ "$SCAN_MINUTES" -gt 60 ]; then
            SCAN_MINUTES=55
          fi
          out="$RUNNER_TEMP/radar-out"
          # Read by export.mjs and published, so the page can say what the scan is doing
          export RADAR_SCAN_STARTED RADAR_CYCLES="$SCAN_MINUTES" RADAR_CYCLE_SECONDS=60 RADAR_RUN="$GITHUB_RUN_NUMBER"
          RADAR_SCAN_STARTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          publish() { # $1: scanning or finished, $2: the cycle just done
            rm -rf "$out" && mkdir -p "$out"
            if ! RADAR_SCAN_STATE="$1" RADAR_CYCLE="$2" node tools/scam-radar/export.mjs --all "$out"; then
              echo "::warning::the export after cycle $2 failed"
              return 0
            fi
            bash tools/scam-radar/publish.sh "$out" || echo "::warning::publishing after cycle $2 failed"
          }
          # Brand look-alikes nobody has listed yet go to the front of the queue
          node tools/scam-radar/prioritize.mjs --limit 300 || echo "::warning::could not prioritise brand look-alikes"
          # The Jamaica hunt searches the scan archive and the blocklists while the scan runs. It only
          # writes a file; its leads join the watchlist between two cycles (see hunt-jamaica.mjs).
          leads="$RUNNER_TEMP/jamaica-leads.json"
          hunt_log="$RUNNER_TEMP/jamaica-hunt.log"
          node tools/scam-radar/hunt-jamaica.mjs --hunt "$leads" --minutes 8 > "$hunt_log" 2>&1 &
          failed=0
          for cycle in $(seq 1 "$SCAN_MINUTES"); do
            began=$(date +%s)
            echo "::group::Cycle $cycle of $SCAN_MINUTES"
            # 300 visits a cycle: a cycle of 150 takes about 30 of its 56 seconds
            if $RADAR run --ticks 1 --seconds 60 --checks 300; then
              failed=0
            else
              failed=$((failed + 1))
              echo "::warning::cycle $cycle stopped with an error"
              if [ "$failed" -ge 3 ]; then
                echo "::endgroup::"
                echo "::error::three cycles in a row stopped with an error"
                publish finished "$cycle"
                exit 1
              fi
            fi
            if [ -s "$leads" ]; then
              node tools/scam-radar/hunt-jamaica.mjs --add "$leads" || echo "::warning::the Jamaica hunt's leads could not be added"
              rm -f "$leads"
              tail -n 40 "$hunt_log" || true
            fi
            publish scanning "$cycle"
            echo "::endgroup::"
            left=$(( began + 60 - $(date +%s) ))
            if [ "$left" -gt 0 ]; then sleep "$left"; fi
          done
          # Tell the page this run is handing over to the next
          publish finished "$SCAN_MINUTES"
          $RADAR status

      - name: Save the Radar database
        # Keep what was learned even if a later cycle failed, but never save a half-built index
        if: always() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          path: ~/.scam-finder
          key: scam-radar-db-${{ github.run_id }}

      - name: Start the next run
        # Last, after the database is saved, so the next run starts from it. Not when a run is
        # cancelled by hand.
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          minutes=$(( ( $(date +%s) - ${SCAN_STARTED:-$(date +%s)} ) / 60 ))
          if [ "$OUTCOME" != "success" ] && [ "$minutes" -lt 10 ]; then
            echo "::warning::This run failed after $minutes minutes of scanning, so it does not start the next one. The keep-alive or a start by hand will."
            exit 0
          fi
          queued=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scam-radar.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\" and .status != \"in_progress\")] | length" || echo 0)
          if [ "${queued:-0}" -gt 0 ]; then
            echo "A run is already waiting to start. It starts the one after it."
            exit 0
          fi
          gh workflow run scam-radar.yml --repo "$GITHUB_REPOSITORY" --ref main -f minutes="$SCAN_MINUTES" -f chained=yes
          echo "Started the next run. It picks up from the database saved above."
