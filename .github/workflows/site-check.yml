# Checks what the live site is serving, from a GitHub runner: which host answers, which commit each
# file matches, the Automa APK, redirects, the CSP, the scan API, how old the Scam Radar data is,
# and the main pages in a real browser. Start it from the Actions tab. It changes nothing.
name: Site check

on:
  workflow_dispatch:
    inputs:
      site:
        description: Address to check
        default: https://corx-labs.com

permissions:
  contents: read
  statuses: read
  checks: read
  deployments: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: ${{ inputs.site || 'https://corx-labs.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # the history tells which commit a live file comes from

      - name: Files, headers and redirects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/site-check.py "$SITE"

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: '22'

      - name: The pages in a browser
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.49.1 > /dev/null
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/site-check-browser.cjs "$SITE"
