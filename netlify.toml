[build]
  publish = "."
  command = ""

# Pretty URLs: /documentation → /documentation/ served from index.html
[build.processing]
  skip_processing = false

[[redirects]]
  from = "https://www.corx-labs.com/*"
  to = "https://corx-labs.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://icons.duckduckgo.com https://*.wikimedia.org https://*.wikipedia.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https://*.trycloudflare.com https://pypi.org https://files.pythonhosted.org https://cdn.jsdelivr.net https://openrouter.ai https://api.anthropic.com https://api.deepseek.com https://api.openai.com https://api.github.com; media-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The voice studio fetches this to put on the clipboard, and people open it
# directly. Declared as text so nosniff cannot stop it rendering in a tab.
[[headers]]
  for = "/chat/tristream-server.py"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/chat/tristream-model.py"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "no-cache"
